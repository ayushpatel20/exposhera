<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World | Premium Creative Space</title>
    <meta name="description" content="A premium, modern, and beautifully crafted minimalist landing page. Designed with interactive aesthetics, canvas particle mechanics, and glassmorphic layouts.">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons for modern UI aesthetics -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Stunning Visual Background System -->
    <div class="bg-gradient-mesh"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="cursor-light"></div>

    <!-- Header Navigation -->
    <header>
        <div class="logo" id="nav-logo">Antigravity.</div>
        <nav class="nav-links">
            <a href="#" class="nav-item" id="nav-home">Home</a>
            <a href="#" class="nav-item" id="nav-showcase">Showcase</a>
            <a href="#" class="nav-item" id="nav-docs">Docs</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <section class="card-container" id="main-portal-card">
            <!-- Subtle backglow filter -->
            <div class="card-glow-element"></div>
            
            <!-- Welcome Badge -->
            <span class="badge">System Initialized</span>
            
            <!-- Hello World Title -->
            <h1 class="title">Hello World</h1>
            
            <!-- Sleek Subheading -->
            <p class="subtitle">
                Welcome to a state-of-the-art landing space. Explore fluid typography, high-performance canvas physics, and immersive interactive glassmorphism.
            </p>
            
            <!-- Contact Section -->
            <div class="contact-info" id="contact-amardeep">
                <i class="fa-regular fa-envelope"></i> Contact: <span class="contact-name">Amardeep</span>
            </div>
            <br>
            
            <!-- Premium Call To Action -->
            <button class="cta-button" id="explore-btn">
                Explore Creative Space
            </button>
        </section>
    </main>

    <!-- Footer Area -->
    <footer>
        <div class="footer-text">
            &copy; 2026 Antigravity Creative Studio. All rights reserved.
        </div>
        <div class="social-links">
            <a href="#" class="social-link" id="footer-github" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-link" id="footer-twitter" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="social-link" id="footer-dribbble" aria-label="Dribbble"><i class="fa-brands fa-dribbble"></i></a>
        </div>
    </footer>

    <!-- Custom Script Logic -->
    <script src="js/script.js"></script>
</body>
</html>
